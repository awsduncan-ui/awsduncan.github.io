name: SEO production audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 07 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit the production site
        run: node scripts/audit-site.mjs
